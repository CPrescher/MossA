name: Deploy release and develop sites

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mossa-main-develop-pages
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            preview: '0'
            base: /MossA
          - branch: develop
            preview: '1'
            base: /MossA/preview
    env:
      MOSSA_PREVIEW: ${{ matrix.preview }}
      MOSSA_PUBLIC_BASE: ${{ matrix.base }}
    steps:
      - name: Check out the selected site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manual/package-lock.json
      - name: Set up Rust and WebAssembly
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: pages-${{ matrix.branch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: pages-${{ matrix.branch }}-${{ env.RUST_VERSION }}-
      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix manual
      - name: Test the selected source
        run: npm test
      - name: Build app and manual with their actual source identity
        env:
          SOURCE_BRANCH: ${{ matrix.branch }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_NAME="$SOURCE_BRANCH" npm run build:pages
          node --input-type=module - "$SOURCE_SHA" "$SOURCE_BRANCH" <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8'));
          assert.equal(info.commit, process.argv[2]);
          assert.equal(info.branch, process.argv[3]);
          assert.equal(info.dirty, false);
          assert.equal(info.channel, process.env.MOSSA_PREVIEW === '1' ? 'github-pages-preview' : 'github-pages');
          JS
      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-${{ matrix.branch }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-main
          path: site
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-develop
          path: site/preview
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both independently built sites
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
