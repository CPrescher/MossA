name: Deploy release and develop sites

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mossa-main-develop-pages
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            preview: '0'
            base: /MossA
          - branch: develop
            preview: '1'
            base: /MossA/preview
    env:
      MOSSA_PREVIEW: ${{ matrix.preview }}
      MOSSA_PUBLIC_BASE: ${{ matrix.base }}
    steps:
      - name: Check out the selected site source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manual/package-lock.json
      - name: Set up Rust and WebAssembly
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: pages-${{ matrix.branch }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: pages-${{ matrix.branch }}-${{ env.RUST_VERSION }}-
      - name: Install locked dependencies
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            return 1
          }
          # Restore tool binaries after npm ci, which removes node_modules.
          # All dependency lifecycle scripts run below after tool preparation.
          retry npm ci --ignore-scripts
          retry npm ci --prefix manual
      - name: Cache pinned WebAssembly build tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.tool_cache }}/mossa-wasm-tools
          key: wasm-tools-${{ runner.os }}-${{ runner.arch }}-pack0.15.1-bindgen0.2.130-binaryen130-v1
      - name: Prepare verified WebAssembly tools
        env:
          GH_TOKEN: ${{ github.token }}
          WASM_TOOLS: ${{ runner.tool_cache }}/mossa-wasm-tools
        run: |
          set -euo pipefail
          download_tool() {
            local name="$1" repo="$2" asset="$3" digest="$4" release="$5" archive="$RUNNER_TEMP/$1.tar.gz"
            if [ -f "$WASM_TOOLS/$name/.verified-$digest" ]; then return; fi
            mkdir -p "$WASM_TOOLS/$name"
            # The release API follows a separate route from /releases/download.
            # Authenticate only to api.github.com; curl drops auth on redirects.
            if ! curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 \
              --connect-timeout 15 --max-time 180 --silent --show-error \
              -H 'Accept: application/octet-stream' -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/releases/assets/$asset" -o "$archive"; then
              curl --fail --location --retry 3 --retry-all-errors --retry-delay 5 \
                --connect-timeout 15 --max-time 180 --silent --show-error "$release" -o "$archive"
            fi
            echo "$digest  $archive" | sha256sum --check --strict
            tar -xzf "$archive" --strip-components=1 -C "$WASM_TOOLS/$name"
            touch "$WASM_TOOLS/$name/.verified-$digest"
          }
          download_tool wasm-pack wasm-bindgen/wasm-pack 691077448 \
            410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2 \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.1/wasm-pack-v0.15.1-x86_64-unknown-linux-musl.tar.gz
          download_tool wasm-bindgen wasm-bindgen/wasm-bindgen 691140647 \
            9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f \
            https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.130/wasm-bindgen-0.2.130-x86_64-unknown-linux-musl.tar.gz
          download_tool binaryen WebAssembly/binaryen 435610959 \
            0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc \
            https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz
          test "$(node -p 'require("./node_modules/wasm-pack/package.json").version')" = 0.15.1
          python3 - <<'PYTHON'
          import tomllib
          with open('rust-core/Cargo.lock', 'rb') as source:
              packages = tomllib.load(source)['package']
          assert next(p['version'] for p in packages if p['name'] == 'wasm-bindgen') == '0.2.130', 'Update pinned CI tools when wasm-bindgen changes'
          PYTHON
          mkdir -p node_modules/wasm-pack/binary
          cp "$WASM_TOOLS/wasm-pack/wasm-pack" node_modules/wasm-pack/binary/wasm-pack
          export PATH="$WASM_TOOLS/wasm-bindgen:$WASM_TOOLS/binaryen/bin:$PATH"
          echo "$WASM_TOOLS/wasm-bindgen" >> "$GITHUB_PATH"
          echo "$WASM_TOOLS/binaryen/bin" >> "$GITHUB_PATH"
          node_modules/wasm-pack/binary/wasm-pack --version
          wasm-bindgen --version
          wasm-opt --version
          npm rebuild --foreground-scripts
      - name: Test the selected source
        run: npm test
      - name: Build app and manual with their actual source identity
        env:
          SOURCE_BRANCH: ${{ matrix.branch }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_NAME="$SOURCE_BRANCH" npm run build:pages
          node --input-type=module - "$SOURCE_SHA" "$SOURCE_BRANCH" <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const info = JSON.parse(readFileSync('dist/build-info.json', 'utf8'));
          assert.equal(info.commit, process.argv[2]);
          assert.equal(info.branch, process.argv[3]);
          assert.equal(info.dirty, false);
          assert.equal(info.channel, process.env.MOSSA_PREVIEW === '1' ? 'github-pages-preview' : 'github-pages');
          JS
      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-${{ matrix.branch }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  assemble:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-main
          path: site
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-develop
          path: site/preview
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both independently built sites
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
