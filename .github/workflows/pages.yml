name: Deploy MossA 2 to GitHub Pages

on:
  push:
    branches: [mossa2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.1

jobs:
  build:
    if: github.ref == 'refs/heads/mossa2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out browser source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
      - name: Set up Rust and WebAssembly
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - name: Cache Rust dependencies and build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Test Rust, compiled WASM, and interface
        run: npm test
      - name: Build static browser application
        run: npm run build:web
      - name: Record deployed source revision
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile('dist/build-info.json', JSON.stringify({
            application: 'MossA 2 preview',
            commit: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
            run: process.env.GITHUB_RUN_ID
          }, null, 2) + '\n');
          NODE
      - name: Upload static site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy browser application
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
