name: Build MossA desktop apps

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Application source ref (empty uses the triggering revision)'
        type: string
        default: ''
      arm64_only:
        description: 'Build only Linux ARM64 and Windows ARM64'
        type: boolean
        default: false
  push:
    branches: [develop]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'rust-core/**'
      - 'manual/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package*.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  RUST_VERSION: 1.99.1

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          ARM64_ONLY: ${{ inputs.arm64_only || false }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          rows = [
            {"runner": "macos-15", "target": "aarch64-apple-darwin", "bundles": "app,dmg"},
            {"runner": "macos-15-intel", "target": "x86_64-apple-darwin", "bundles": "app,dmg"},
            {"runner": "windows-2022", "target": "x86_64-pc-windows-msvc", "bundles": "nsis,msi"},
            {"runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu", "bundles": "appimage,deb"},
            {"runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc", "bundles": "nsis,msi"},
            {"runner": "ubuntu-22.04-arm", "target": "aarch64-unknown-linux-gnu", "bundles": "appimage,deb"},
          ]
          if os.environ["ARM64_ONLY"] == "true":
              rows = [r for r in rows if r["target"] in {"aarch64-pc-windows-msvc", "aarch64-unknown-linux-gnu"}]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": rows}) + "\n")
          PYTHON

  scientific-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
      - name: Set up Rust and WebAssembly
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - run: npm ci
      - run: npm ci --prefix manual
      - run: npm test
      - name: Verify native backend parity, progress, cancellation, and parallel comparisons
        run: npm run test:native
      - name: Preserve the platform-independent WASM reference for native parity tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MossA-test-wasm
          path: src/wasm/
          if-no-files-found: error
          retention-days: 14
      - name: Test notarization recovery without Apple credentials
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Build the candidate browser app and matching manual
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_NAME="$SOURCE_REF" MOSSA_SOURCE_REF="$SOURCE_SHA" npm run build:pages
          python3 scripts/package-web.py
      - name: Upload the browser app without deploying it
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MossA-browser
          path: release-web/
          if-no-files-found: error
          retention-days: 30

  desktop:
    needs: [scientific-tests, plan]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libfuse2 fonts-dejavu-core
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.12.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            manual/package-lock.json
      - name: Set up native Rust
        run: |
          rustup toolchain install "$RUST_VERSION-${{ matrix.target }}" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION-${{ matrix.target }}"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
            src-tauri/target
          key: desktop-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('rust-core/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ matrix.target }}-${{ env.RUST_VERSION }}-
      - name: Install locked JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix manual
      - name: Build app, offline documentation, and installers
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          GITHUB_SHA="$SOURCE_SHA" GITHUB_REF_NAME="$SOURCE_REF" npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify native executable architecture and build identity
        env:
          BUILD_TARGET: ${{ matrix.target }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const target=process.env.BUILD_TARGET, arm=target.startsWith('aarch64-'), win=process.platform==='win32';
          const path=`src-tauri/target/${target}/release/mossa-desktop${win?'.exe':''}`, bytes=readFileSync(path);
          let machine;
          if(win) {assert.equal(bytes.readUInt16LE(0),0x5a4d);const pe=bytes.readUInt32LE(0x3c);assert.equal(bytes.readUInt32LE(pe),0x4550);machine=bytes.readUInt16LE(pe+4);assert.equal(machine,arm?0xaa64:0x8664);}
          else if(process.platform==='linux') {assert.equal(bytes.subarray(0,4).toString('hex'),'7f454c46');assert.equal(bytes[4],2);machine=bytes.readUInt16LE(18);assert.equal(machine,arm?183:62);}
          else machine='Mach-O';
          if(arm) {assert.equal(process.arch,'arm64');assert.match(execFileSync('rustc',['-vV'],{encoding:'utf8'}),new RegExp(`host: ${target}`));}
          const info=JSON.parse(readFileSync('dist-desktop/build-info.json','utf8')), source=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          assert.equal(info.commit,source);assert.equal(info.dirty,false);assert.equal(info.fittingBackend,'native-rust');
          const receipt={target,version:info.version,sourceCommit:source,workflowCommit:process.env.WORKFLOW_SHA,hostArch:process.arch,machine,executableSha256:createHash('sha256').update(bytes).digest('hex')};
          writeFileSync('dist-desktop/target-info.json',JSON.stringify(receipt,null,2)+'\n');console.log(receipt);
          JS
      - name: Test native desktop command boundaries
        run: cargo test --locked --release --features custom-protocol --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Check the native core on ARM64
        if: startsWith(matrix.target, 'aarch64-') && runner.os != 'macOS'
        run: cargo test --locked --release --manifest-path rust-core/Cargo.toml --target ${{ matrix.target }}
      - name: Download the tested WASM reference for ARM64 parity
        if: startsWith(matrix.target, 'aarch64-') && runner.os != 'macOS'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MossA-test-wasm
          path: src/wasm/
      - name: Test ARM64 native parity, progress, cancellation, and comparisons
        if: startsWith(matrix.target, 'aarch64-') && runner.os != 'macOS'
        run: node scripts/test-native.mjs
      - name: Archive macOS application with permissions and symlinks
        if: runner.os == 'macOS'
        run: tar -czf "dist-desktop/MossA-${{ matrix.target }}.app.tar.gz" -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" MossA.app
      - name: Preserve compiled dependencies even if packaging fails
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust-core/target
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload desktop installers and build identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MossA-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            dist-desktop/*.app.tar.gz
            dist-desktop/build-info.json
            dist-desktop/target-info.json

# These are preview artifacts. This workflow does not tag or publish releases.
# macOS artifacts are ad-hoc signed; public distribution additionally needs
# Developer ID signing and notarization (see DESKTOP.md).
