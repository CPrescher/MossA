[package]
name = "mossa-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "MossA spectral models and bounded fitting for native Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
basin = "=3.2.0"
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
rustfft = "6.4"
js-sys = "0.3"
web-time = "1"

[profile.release]
lto = true
opt-level = 3
