[package]
name = "mossa-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MossA spectral models and bounded fitting for native Rust and WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Opt-in FFT algorithm experiment. Build with +simd128 as well (wasm:simd).
# Its different rounding fails the strict curve-equivalence gate; keep scalar
# FFTs as the default, preserving fitted parameters and std bit-for-bit.
wasm-simd = ["rustfft/wasm_simd"]

[dependencies]
basin = "=3.2.0"
nalgebra = "0.34"
serde = { version = "1", features = ["derive"] }
# Preserve fixed source parameters and nuclear constants exactly across JS/WASM.
serde_json = { version = "1", features = ["float_roundtrip"] }
wasm-bindgen = "0.2"
rustfft = "6.4"
js-sys = "0.3"
web-time = "1"

[profile.release]
lto = true
opt-level = 3
